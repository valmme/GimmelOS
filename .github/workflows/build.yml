name: Build OS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            grub-pc-bin \
            grub-common \
            xorriso \
            mtools \
            gcc-multilib \
            g++-multilib

      - name: Build
        run: make

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: gimmelos-iso
          path: build/gimmelos.iso